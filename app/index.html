<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loudbox</title>
<meta name="theme-color" content="#100e1a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="titlebar" id="titlebar">
  <div class="tb-brand"><img src="icon.svg" alt=""><span>Loudbox</span></div>
  <form class="tb-search" id="tb-search" role="search" autocomplete="off">
    <svg viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.8 4.8-1.4 1.4-4.8-4.8A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg>
    <input id="tb-search-input" type="search" placeholder="What do you want to play?" aria-label="Search songs or artists" spellcheck="false">
    <kbd>Ctrl K</kbd>
    <div class="suggest" id="suggest" hidden></div>
  </form>
  <div class="tb-drag"></div>
  <div class="win-controls" id="win-controls" hidden>
    <button class="wc dl-toggle" id="dl-toggle" title="Downloads" aria-label="Downloads" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M11 3h2v10.2l3.6-3.6 1.4 1.4-6 6-6-6 1.4-1.4 3.6 3.6zM4 19h16v2H4z"/></svg><span class="dl-badge" id="dl-badge" hidden></span><span class="dl-ring" id="dl-ring" hidden></span></button>
    <button class="wc pin" id="win-pin" title="Pin on top of other windows (P)" aria-label="Pin on top" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M15 3l6 6-2 1-3.5 3.5L15 18l-1.5 1.5-4-4L4.5 20.5 3.5 19.5l5-5-4-4L6 9l4.5-.5L14 5z"/></svg></button>
    <span class="wc-sep"></span>
    <button class="wc" id="win-min" title="Minimize" aria-label="Minimize"><svg viewBox="0 0 24 24"><path d="M5 11h14v2H5z"/></svg></button>
    <button class="wc" id="win-max" title="Maximize" aria-label="Maximize or restore"><svg viewBox="0 0 24 24"><path d="M5 5h14v14H5zm2 2v10h10V7z"/></svg></button>
    <button class="wc close" id="win-close" title="Close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="m6.4 5 5.6 5.6L17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6l5.6-5.6L5 6.4z"/></svg></button>
  </div>
</header>
<section class="dl-panel" id="dl-panel" hidden aria-label="Downloads">
  <div class="dl-head">
    <h3>Downloads</h3>
    <button class="icon-btn small" id="dl-close" aria-label="Close downloads"><svg viewBox="0 0 24 24"><path d="m6.4 5 5.6 5.6L17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6l5.6-5.6L5 6.4z"/></svg></button>
  </div>
  <div class="dl-folder"><span>Saving to</span><code id="dl-folder-path">…</code></div>
  <div class="dl-actions">
    <button class="chip" id="dl-open">Open folder</button>
    <button class="chip" id="dl-change">Change folder</button>
    <button class="chip" id="dl-clear">Clear finished</button>
  </div>
  <div class="dl-list" id="dl-list"></div>
</section>
<div class="app">
  <aside class="sidebar">
    <nav class="nav">
      <button class="nav-item" data-view="home" id="nav-home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg><span>Home</span></button>
      <button class="nav-item" data-view="search" id="nav-search"><svg viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.8 4.8-1.4 1.4-4.8-4.8A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg><span>Search</span></button>
      <button class="nav-item" data-view="library" id="nav-library"><svg viewBox="0 0 24 24"><path d="M4 3h2v18H4zm5 0h2v18H9zm5.2.6 1.9-.6 5 17.4-1.9.6z"/></svg><span>Library</span></button>
      <button class="nav-item" data-view="queue" id="nav-queue"><svg viewBox="0 0 24 24"><path d="M3 5h13v2H3zm0 6h13v2H3zm0 6h8v2H3zm15-4v-2h2v2h2v2h-2v2h-2v-2h-2v-2z"/></svg><span>Queue</span></button>
    </nav>
    <div class="side-head">
      <span>Playlists</span>
      <button class="icon-btn small" id="new-playlist" title="New playlist" aria-label="New playlist"><svg viewBox="0 0 24 24"><path d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7z"/></svg></button>
    </div>
    <div class="side-playlists" id="side-playlists"></div>
    <a class="get-app" id="get-app" href="https://github.com/Marko-D/loudbox/releases/latest" target="_blank" rel="noopener" hidden><svg viewBox="0 0 24 24"><path d="M11 3h2v10.2l3.6-3.6 1.4 1.4-6 6-6-6 1.4-1.4 3.6 3.6zM4 19h16v2H4z"/></svg><span>Get the Windows app<small>Downloads, mini player, pin on top</small></span></a>
  </aside>

  <main class="main" id="main" tabindex="-1"></main>

  <aside class="nowpanel" id="nowpanel">
    <div class="np-label" id="np-label">Now playing</div>
    <div class="video-wrap" id="video-wrap"><div id="yt"></div><div class="video-empty" id="video-empty">Pick a song to start</div></div>
    <div class="np-title" id="np-title">Nothing playing</div>
    <div class="np-artist" id="np-artist">Add a YouTube link to get going</div>
    <div class="np-next-label">Next up</div>
    <div class="np-next" id="np-next"></div>
  </aside>

  <footer class="bar">
    <div class="bar-track">
      <span class="bar-cover" id="bar-cover" hidden><img id="bar-thumb" class="bar-thumb" alt="" hidden><span class="cover-eq"><span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span></span></span>
      <div class="bar-text">
        <div class="bar-title-row"><span class="bar-eq" id="bar-eq" hidden><span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span></span><div class="bar-title" id="bar-title">Nothing playing</div></div>
        <div class="bar-artist" id="bar-artist"></div>
      </div>
      <button class="icon-btn" id="bar-radio" title="Start radio from this song" aria-label="Start radio from this song"><svg viewBox="0 0 24 24"><path d="M12 10a2 2 0 1 1 0 4 2 2 0 0 1 0-4zM7.8 7.8l1.4 1.4a4 4 0 0 0 0 5.6l-1.4 1.4a6 6 0 0 1 0-8.4zm8.4 0a6 6 0 0 1 0 8.4l-1.4-1.4a4 4 0 0 0 0-5.6zM5 5l1.4 1.4a8 8 0 0 0 0 11.2L5 19A10 10 0 0 1 5 5zm14 0a10 10 0 0 1 0 14l-1.4-1.4a8 8 0 0 0 0-11.2z"/></svg></button>
      <button class="icon-btn" id="bar-dl" title="Download this song" aria-label="Download this song" hidden><svg viewBox="0 0 24 24"><path d="M11 3h2v10.2l3.6-3.6 1.4 1.4-6 6-6-6 1.4-1.4 3.6 3.6zM4 19h16v2H4z"/></svg></button>
      <button class="icon-btn" id="bar-like" title="Add to a playlist" aria-label="Add to a playlist"><svg viewBox="0 0 24 24"><path d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7z"/></svg></button>
    </div>
    <div class="bar-center">
      <div class="controls">
        <button class="icon-btn" id="btn-shuffle" title="Shuffle (S)" aria-label="Shuffle"><svg viewBox="0 0 24 24"><path d="M16 3h5v5l-1.8-1.8-4.4 4.4-1.4-1.4 4.4-4.4zM3 5.4 4.4 4 20 19.6V16h1.5v5h-5v-1.5h2.1zM9.8 13.4l1.4 1.4-6.8 6.8L3 20.2z"/></svg></button>
        <button class="icon-btn" id="btn-prev" title="Previous (Shift+←)" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zm3.5 7L19 5v14z"/></svg></button>
        <button class="play-btn" id="btn-play" title="Play (Space)" aria-label="Play"><svg viewBox="0 0 24 24" id="play-icon"><path d="M7 4.5v15L20 12z"/></svg></button>
        <button class="icon-btn" id="btn-next" title="Next (Shift+→)" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM5 5l9.5 7L5 19z"/></svg></button>
        <button class="icon-btn" id="btn-repeat" title="Repeat (R)" aria-label="Repeat"><svg viewBox="0 0 24 24"><path d="M7 7h10V4l4 4-4 4V9H7v4H5V9a2 2 0 0 1 2-2zm10 10H7v3l-4-4 4-4v3h10v-4h2v4a2 2 0 0 1-2 2z"/></svg><span class="repeat-one" id="repeat-one" hidden>1</span></button>
      </div>
      <div class="seek">
        <span class="time" id="t-cur">0:00</span>
        <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek">
        <span class="time" id="t-dur">0:00</span>
      </div>
    </div>
    <div class="bar-right">
      <button class="icon-btn" id="bar-lyrics" title="Lyrics (L)" aria-label="Lyrics"><svg viewBox="0 0 24 24"><path d="M12 2a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V6a4 4 0 0 1 4-4zm0 2a2 2 0 0 0-2 2v6a2 2 0 0 0 4 0V6a2 2 0 0 0-2-2zm-7 8h2a5 5 0 0 0 10 0h2a7 7 0 0 1-6 6.9V22h-2v-3.1A7 7 0 0 1 5 12z"/></svg></button>
      <button class="icon-btn" id="btn-video" title="Show or hide video (V)" aria-label="Show or hide video"><svg viewBox="0 0 24 24"><path d="M3 5h18v14H3zm2 2v10h14V7zm5 2 5 3-5 3z"/></svg></button>
      <button class="icon-btn" id="btn-mute" title="Mute (M)" aria-label="Mute"><svg viewBox="0 0 24 24" id="vol-icon"><path d="M4 9h4l5-4v14l-5-4H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></button>
      <input type="range" id="volume" min="0" max="100" value="80" aria-label="Volume">
    </div>
  </footer>

  <nav class="mobile-nav">
    <button class="nav-item" data-view="home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg><span>Home</span></button>
    <button class="nav-item" data-view="search"><svg viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.8 4.8-1.4 1.4-4.8-4.8A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg><span>Search</span></button>
    <button class="nav-item" data-view="library"><svg viewBox="0 0 24 24"><path d="M4 3h2v18H4zm5 0h2v18H9zm5.2.6 1.9-.6 5 17.4-1.9.6z"/></svg><span>Library</span></button>
    <button class="nav-item" data-view="queue"><svg viewBox="0 0 24 24"><path d="M3 5h13v2H3zm0 6h13v2H3zm0 6h8v2H3zm15-4v-2h2v2h2v2h-2v2h-2v-2h-2v-2z"/></svg><span>Queue</span></button>
  </nav>
</div>

<div class="menu" id="menu" hidden></div>
<div class="modal-back" id="modal" hidden><div class="modal" id="modal-body"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
